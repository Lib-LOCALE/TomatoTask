[package]
name = "tomatotask"
version = "1.2.0"
description = "Local-first Pomodoro timer and task manager"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/Lib-LOCALE/TomatoTask"

[dependencies]
chrono = "0.4"
dirs = "6"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis", "mp3"] }
notify-rust = "4.18"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "~1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }

[build-dependencies]
slint-build = "~1.18.1"

[profile.release]
strip = true
