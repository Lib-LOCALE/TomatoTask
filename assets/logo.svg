<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dégradé principal de la tomate -->
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E4D" />
      <stop offset="50%" stop-color="#E63926" />
      <stop offset="100%" stop-color="#B81D13" />
    </linearGradient>

    <!-- Dégradé des feuilles -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CD964" />
      <stop offset="100%" stop-color="#28A745" />
    </linearGradient>

    <!-- Ombre portée douce -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    /* Respiration douce de la tomate */
    .tomato-group {
      transform-origin: 60px 68px;
      animation: pulse 4s ease-in-out infinite;
    }

    /* Oscillation de la feuille façon tic-tac */
    .stem-group {
      transform-origin: 60px 32px;
      animation: tickLeaf 2s ease-in-out infinite;
    }

    /* Rotation de l'aiguille du Pomodoro */
    .timer-hand {
      transform-origin: 60px 68px;
      animation: spinHand 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Cercle de progression du minuteur */
    .progress-ring {
      transform-origin: 60px 68px;
      transform: rotate(-90deg);
      stroke-dasharray: 138;
      stroke-dashoffset: 138;
      animation: fillRing 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Apparition du Check (Task) à la fin du cycle */
    .task-check {
      stroke-dasharray: 36;
      stroke-dashoffset: 36;
      animation: showCheck 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes tickLeaf {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes spinHand {
      0% { transform: rotate(0deg); opacity: 1; }
      70% { transform: rotate(360deg); opacity: 1; }
      75%, 92% { transform: rotate(360deg); opacity: 0; }
      100% { transform: rotate(360deg); opacity: 1; }
    }

    @keyframes fillRing {
      0% { stroke-dashoffset: 138; }
      70% { stroke-dashoffset: 0; }
      90%, 100% { stroke-dashoffset: 138; }
    }

    @keyframes showCheck {
      0%, 68% { stroke-dashoffset: 36; opacity: 0; }
      75%, 88% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 36; opacity: 0; }
    }
  </style>

  <g class="tomato-group" filter="url(#shadow)">
    <!-- Corps de la tomate (forme organique légèrement aplatie) -->
    <path d="M 60,30
             C 30,28 16,46 16,69
             C 16,94 35,107 60,107
             C 85,107 104,94 104,69
             C 104,46 90,28 60,30 Z" fill="url(#tomatoGrad)" />

    <!-- Reflet supérieur gauche (effet glossy vectoriel) -->
    <path d="M 28,58 C 28,44 39,36 52,35 C 42,39 34,47 32,59 C 31,62 28,61 28,58 Z" fill="#FFFFFF" opacity="0.35" />

    <!-- Anneau de fond du cadran -->
    <circle cx="60" cy="68" r="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.2" />

    <!-- Anneau de progression animé -->
    <circle class="progress-ring" cx="60" cy="68" r="22" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- Repères horaires (12h, 3h, 6h, 9h) -->
    <circle cx="60" cy="51" r="1.5" fill="#FFFFFF" opacity="0.7" />
    <circle cx="77" cy="68" r="1.5" fill="#FFFFFF" opacity="0.7" />
    <circle cx="60" cy="85" r="1.5" fill="#FFFFFF" opacity="0.7" />
    <circle cx="43" cy="68" r="1.5" fill="#FFFFFF" opacity="0.7" />

    <!-- Aiguille du Pomodoro -->
    <g class="timer-hand">
      <line x1="60" y1="68" x2="60" y2="53" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="60" cy="68" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Coche de validation (Task) qui s'affiche en fin de tour -->
    <path class="task-check" d="M 50,68 L 57,75 L 71,61" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pédoncule et feuilles (Couronne de la tomate) -->
    <g class="stem-group">
      <!-- Tige centrale -->
      <path d="M 57,31 C 57,23 60,17 63,15 C 65,14 66,16 64,19 C 62,22 62,27 63,31 Z" fill="url(#leafGrad)" />
      <!-- Feuille gauche -->
      <path d="M 60,29 C 50,27 40,31 35,37 C 43,36 52,35 60,32 Z" fill="url(#leafGrad)" />
      <!-- Feuille droite -->
      <path d="M 60,29 C 70,27 80,31 85,37 C 77,36 68,35 60,32 Z" fill="url(#leafGrad)" />
      <!-- Feuille avant gauche -->
      <path d="M 60,30 C 54,32 48,38 46,43 C 52,40 57,36 60,32 Z" fill="#28A745" />
      <!-- Feuille avant droite -->
      <path d="M 60,30 C 66,32 72,38 74,43 C 68,40 63,36 60,32 Z" fill="#28A745" />
    </g>
  </g>
</svg>